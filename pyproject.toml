[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["alerts", "scripts", "tests"]

# LangGraph의 데코레이터·제네릭은 strict 모드에서 Any를 흘린다.
# 우리 코드의 타입은 그대로 강제하되, 프레임워크 경계에서만 완화한다.
[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "supabase.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
