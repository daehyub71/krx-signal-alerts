name: alert

# 평일 아침 08:20 KST. GitHub cron은 UTC이므로 23:20 UTC이고,
# 요일도 하루 당겨진다 — 한국 월~금 = UTC 일~목(0-4).
#
# ⚠ GitHub의 예약 실행은 정시를 보장하지 않는다. 부하에 따라 수 분~수십 분 밀린다.
#    08:20으로 잡은 것은 장 시작(09:00) 전에 여유를 두기 위해서다.
on:
  schedule:
    - cron: "20 23 * * 0-4"
  workflow_dispatch:
    inputs:
      channel:
        description: "발송 채널"
        type: choice
        options: [both, email, kakao]
        default: both
      dry_run:
        description: "발송하지 않고 결과만 본다"
        type: boolean
        default: false

# 최소 권한. 이 워크플로는 저장소에 아무것도 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: alert
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리닝 · 발송
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          SIGNALS_WEB_URL: ${{ vars.SIGNALS_WEB_URL }}
        run: |
          python -m alerts.main \
            --channel "${{ inputs.channel || 'both' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # 하위 `krx-signal-briefing`을 깨운다 (하위 SPEC D3·F0).
      #
      # **`workflow_run`은 같은 저장소 안에서만 동작한다** — 다른 리포를 깨우려면
      # `repository_dispatch`뿐이고, 그래서 토큰이 필요하다.
      #
      # `if: always()`가 아니다. 스크리닝이 실패했으면 `ksa_signals`가 비어 있어
      # 브리핑이 깨어나도 할 일이 없다. 그런 날은 하위의 예비 cron(09:05 KST)이
      # `ksa_runs`를 보고 판단한다.
      #
      # **실패해도 이 워크플로를 실패시키지 않는다** — 알림은 이미 나갔다.
      # 토큰이 만료되면 하위는 예비 cron으로 돈다.
      - name: 브리핑 깨우기
        if: success() && !inputs.dry_run
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BRIEFING_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::BRIEFING_DISPATCH_TOKEN 없음 — 하위는 예비 cron으로 돕니다"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/daehyub71/krx-signal-briefing/dispatches \
            -d '{"event_type":"alert-completed"}')
          if [ "$code" = "204" ]; then
            echo "브리핑 깨움 (204)"
          else
            echo "::warning::브리핑 깨우기 실패 HTTP $code — 하위는 예비 cron으로 돕니다"
            head -c 300 /tmp/dispatch.out
          fi

      - name: 검증 깨우기
        if: success() && !inputs.dry_run
        continue-on-error: true
        env:
          # 하위 `krx-signal-verify` 전용 fine-grained PAT (대상 리포 1개 · Contents write).
          # BRIEFING_DISPATCH_TOKEN은 그 리포 권한이 없어 403이 났다 (2026-09-07 실측).
          TOKEN: ${{ secrets.VERIFY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::VERIFY_DISPATCH_TOKEN 없음 — 하위는 예비 cron으로 돕니다"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch2.out -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/daehyub71/krx-signal-verify/dispatches \
            -d '{"event_type":"alert-completed"}')
          if [ "$code" = "204" ]; then
            echo "검증 깨움 (204)"
          else
            echo "::warning::검증 깨우기 실패 HTTP $code — 하위는 예비 cron으로 돕니다"
            head -c 300 /tmp/dispatch2.out
          fi
